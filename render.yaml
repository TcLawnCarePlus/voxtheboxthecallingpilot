# VoxTheBoxTheCallingPilot — Render Blueprint.
# Deploy with: Render dashboard -> New -> Blueprint -> point it at the repo
# containing this file. Or create the web service by hand with the same
# settings (see README.md). Nothing here deploys by itself.
# The database is step 3 in the go-live plan: the Blueprint provisions it
# here so DATABASE_URL is set from the start; the app still runs without
# it (local SQLite fallback) but bookings will not persist reliably on a
# free web service until the database is attached.
services:
  - type: web
    name: voxtheboxthecallingpilot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vox-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_BASE_URL
        sync: false
      - key: PLATFORM_CARRIER_API_KEY
        sync: false
      - key: PLATFORM_CARRIER_ACCOUNT_ID
        sync: false
databases:
  - name: vox-db
    plan: free
    databaseName: voxdb
    user: voxdb
